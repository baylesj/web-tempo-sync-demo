# Tests the site, then publishes it to https://baylesj.github.io/web-tempo-sync-demo/ on every push to main.
# Local script and stylesheet URLs are stamped with the commit (tools/stamp.py), so a browser never runs one
# release's modules against another's page. Pull requests test only.
name: Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test
        run: node --test --test-timeout=30000 test/*.test.mjs && python3 test/test_http_serve.py
      - name: Build the site
        run: |
          mkdir _site
          git archive HEAD -- . ':!test' ':!tools' ':!.github' | tar -x -C _site
          python3 tools/stamp.py _site "${GITHUB_SHA::7}"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
